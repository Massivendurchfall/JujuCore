  - "pl"
  - "bukkit:plugins"
  - "bukkit:pl"
  - "version"
  - "ver"
  - "about"
  - "bukkit:version"
  - "bukkit:ver"
  - "bukkit:about"
  - "paper"
  - "paper:paper"
  - "icanhasbukkit"
  - "help"
  - "?"
  - "bukkit:help"
  - "bukkit:?"
  - "minecraft:help"
